# Soccer Live Hub — Complete YAML Configuration Guide
#
# Card Type: custom:soccer-live-hub
# All card modules are loaded through the main `custom:soccer-live-hub` card.
# Select the desired module using `card_type` (e.g., team, standings, matches, news, etc.)
# or combine multiple modules using `modules:` array or `card_type: hub`.

---

# STANDINGS MODULE
type: custom:soccer-live-hub
card_type: standings
entity: sensor.soccer_live_standings_ned_1
language: auto           # auto-detect from HA locale
appearance: ha          # ha, dark, light
max_teams_visible: 18   # show top N teams
hide_header: false

---

# TEAM / MATCH MODULE
type: custom:soccer-live-hub
card_type: team
entity: sensor.soccer_live_next_ned_1_feyenoord_rotterdam
show_event_toasts: true # goal celebration toasts

---

# MATCHES LIST MODULE
type: custom:soccer-live-hub
card_type: matches
entity: sensor.soccer_live_all_ned_1
max_events_visible: 6

---

# NEWS MODULE
type: custom:soccer-live-hub
card_type: news
entity: sensor.soccer_live_news_ned_1
max_articles: 5

---

# LINEUP MODULE
type: custom:soccer-live-hub
card_type: lineup
entity: sensor.soccer_live_next_ned_1_feyenoord_rotterdam

---

# TIMELINE MODULE
type: custom:soccer-live-hub
card_type: timeline
entity: sensor.soccer_live_next_ned_1_feyenoord_rotterdam

---

# BRACKET MODULE
type: custom:soccer-live-hub
card_type: bracket
entity: sensor.soccer_live_bracket_uefa_champions
style: tree             # list or tree

---

# TOP SCORERS MODULE
type: custom:soccer-live-hub
card_type: scorers
entity: sensor.soccer_live_scorers_ned_1
max_items: 10

---

# COUNTDOWN MODULE
type: custom:soccer-live-hub
card_type: countdown
entity: sensor.soccer_live_next_ned_1_feyenoord_rotterdam

---

# MINI STANDINGS MODULE
type: custom:soccer-live-hub
card_type: mini-standings
entity: sensor.soccer_live_standings_ned_1
max_rows: 5

---

# MATCH CENTER MODULE
type: custom:soccer-live-hub
card_type: match-center
entity: sensor.soccer_live_next_ned_1_feyenoord_rotterdam

---

# CLUB PROFILE MODULE
type: custom:soccer-live-hub
card_type: club
entity: sensor.soccer_live_club_feyenoord_rotterdam

---

# TEAM FORM MODULE
type: custom:soccer-live-hub
card_type: team-form
entity: sensor.soccer_live_next_ned_1_feyenoord_rotterdam

---

# MULTI TEAM MODULE
type: custom:soccer-live-hub
card_type: multi-team
entity: sensor.soccer_live_all_mixed_feyenoord_rotterdam

---

# TEAM COMPETITIONS MODULE
type: custom:soccer-live-hub
card_type: team-competitions
entity: sensor.soccer_live_all_mixed_feyenoord_rotterdam

---

# MULTI-MODEL TAB HUB (F1 Sensor Style)
type: custom:soccer-live-hub
card_type: hub
auto_discover_models: true
match_model: sensor.soccer_live_next_ned_1_feyenoord_rotterdam
standings_model: sensor.soccer_live_standings_ned_1
scorers_model: sensor.soccer_live_scorers_ned_1
last_match_model: sensor.soccer_live_last_ned_1_feyenoord_rotterdam
news_model: sensor.soccer_live_news_ned_1
club_model: sensor.soccer_live_club_feyenoord_rotterdam
appearance: ha

---

# MULTI-MODULE STACKED CARD
type: custom:soccer-live-hub
title: Feyenoord Dashboard
modules:
  - type: team
    entity: sensor.soccer_live_next_ned_1_feyenoord_rotterdam
  - type: standings
    entity: sensor.soccer_live_standings_ned_1
  - type: matches
    entity: sensor.soccer_live_all_ned_1
  - type: news
    entity: sensor.soccer_live_news_ned_1
